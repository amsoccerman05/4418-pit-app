<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="origin">
<title>Suite connection check</title>
<style>body{font:16px system-ui;max-width:40rem;margin:2rem auto;padding:0 1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{display:none}a{display:inline-block;padding:1rem 0}</style>
<h1>Suite connection check</h1>
<p>This checks whether Pit can read your existing Hub session. It does not sign you in or out. No tokens, email addresses, or account details are displayed or saved.</p>
<pre id="result" role="status">Starting…</pre>
<a href="https://team.frc4418.org/">Return to Team Hub</a>
<script>
(() => {
  const hub = 'https://team.frc4418.org';
  const protocol = '4418-suite-auth-v1';
  const start = performance.now();
  const output = document.getElementById('result');
  const frame = document.createElement('iframe');
  let complete = false;
  const id = crypto.randomUUID();
  const log = text => output.textContent += '\n' + ((performance.now()-start)/1000).toFixed(1) + 's: ' + text;
  const timer = setTimeout(() => { complete = true; log('Connection timed out; no session response received.'); }, 35000);
  window.addEventListener('message', event => {
    if (event.origin !== hub || event.source !== frame.contentWindow || event.data?.protocol !== protocol) return;
    if (event.data.event) {
      log('Auth event: ' + (['INITIAL_SESSION','SIGNED_IN','SIGNED_OUT','TOKEN_REFRESHED','PASSWORD_RECOVERY'].includes(event.data.event) ? event.data.event : 'other') + '; ' + (event.data.session ? 'session present' : 'no session'));
    }
    if (event.data.id !== id || complete) return;
    complete = true;
    clearTimeout(timer);
    const result = event.data.result;
    log(result?.error ? 'Session request returned an error.' : result?.data?.session ? 'Session request succeeded: session present.' : 'Session request succeeded: no session.');
  });
  frame.title = 'Team 4418 secure session';
  frame.referrerPolicy = 'origin';
  frame.src = hub + '/suite-auth.html';
  frame.onload = () => {
    log('Hub broker frame loaded; requesting session.');
    frame.contentWindow.postMessage({protocol,id,method:'getSession',args:[]},hub);
  };
  document.body.append(frame);
})();
</script>
</html>
